    // =========================================================================
    // ESTADO DA APLICAÇÃO (CLIENT-SIDE REACTIVE STORE)
    // =========================================================================
    let state = {
      theme: localStorage.getItem('ius_theme') || 'dark',
      currentScreen: 'connect', // 'connect' | 'sync' | 'inbox'
      currentFolder: 'inbox',
      currentCategory: 'all',
      searchQuery: '',
      selectedEmailId: MOCK_EMAILS[0].id,
      readingMode: 'formatted', // 'formatted' | 'clean'
      syncProgress: 0,
      showReplyModal: false,
      replyContent: '',
      emails: [...MOCK_EMAILS],
      readerWidthPercent: 55 // % do leitor
    };

    function applyTheme() {
      if (state.theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      }
      localStorage.setItem('ius_theme', state.theme);
    }
    applyTheme();

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      render();
    }

    // =========================================================================
    // MÉTODOS DE AÇÃO
    // =========================================================================
    function startInteractiveDemo() {
      state.currentScreen = 'sync';
      state.syncProgress = 0;
      render();

      let progress = 12;
      const interval = setInterval(() => {
        progress += 18;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          state.syncProgress = 100;
          render();
          setTimeout(() => {
            state.currentScreen = 'inbox';
            render();
          }, 600);
        } else {
          state.syncProgress = progress;
          render();
        }
      }, 260);
    }

    function selectEmail(id) {
      state.selectedEmailId = id;
      const email = state.emails.find(e => e.id === id);
      if (email) email.isUnread = false;
      render();
    }

    function toggleStar(e, id) {
      e.stopPropagation();
      const email = state.emails.find(m => m.id === id);
      if (email) {
        email.isStarred = !email.isStarred;
        render();
      }
    }

    function toggleRead(id) {
      const email = state.emails.find(m => m.id === id);
      if (email) {
        email.isUnread = !email.isUnread;
        render();
      }
    }

    function archiveEmail(id) {
      state.emails = state.emails.filter(e => e.id !== id);
      if (state.emails.length > 0) state.selectedEmailId = state.emails[0].id;
      else state.selectedEmailId = null;
      render();
    }

    function sendReply() {
      if (!state.replyContent.trim()) return;
      alert('Resposta enviada com sucesso! Sincronizada com o histórico da conversa.');
      state.showReplyModal = false;
      state.replyContent = '';
      render();
    }

    function downloadMockAttachment(filename) {
      const text = `Documento: ${filename}\nPlataforma: IUS Email Control Enterprise\nConformidade verificada com diretrizes IUS Natura.`;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // =========================================================================
    // RENDERIZADOR PRINCIPAL
    // =========================================================================
    function render() {
      const app = document.getElementById('app');
      if (state.currentScreen === 'connect') {
        app.innerHTML = renderConnectScreen();
      } else if (state.currentScreen === 'sync') {
        app.innerHTML = renderSyncScreen();
      } else {
        app.innerHTML = renderInboxScreen();
      }
    }

    // --- TELA 2: SINCRONIZAÇÃO INTELIGENTE ---

      const p = state.syncProgress;
      const stepIdx = Math.min(Math.floor((p / 100) * 7), 6);
      const steps = [
        'Conexão segura estabelecida com a conta Google',
        'Varredura de cabeçalhos e tópicos prioritários',
        'Conversas e remetentes organizados',
        'Extração e sanitização dos corpos de e-mail',
        'Cruzamento com os 11 Escopos de Legislação IUS',
        'Identificação de prazos e obrigações operacionais',
        'Painel executivo pronto para utilização'
      ];

      return `
        <div class="h-full flex items-center justify-center p-6 bg-slate-50 dark:bg-[#090d13]">

            </div>

                <div class="h-full bg-emerald-500 transition-all duration-300 rounded-full" style="width: ${p}%"></div>
              </div>
            </div>

            <!-- Checklist 7 Etapas -->
            <div class="text-left space-y-2 text-xs bg-slate-50 dark:bg-slate-900/60 p-4 rounded-xl border border-slate-200 dark:border-slate-800">

                <div class="flex items-center gap-2.5 ${i < stepIdx ? 'text-emerald-600 dark:text-emerald-400 font-medium' : i === stepIdx ? 'text-slate-900 dark:text-white font-bold' : 'text-slate-400 dark:text-slate-600'}">

    // --- TELA 3: CENTRAL DE E-MAIL (3-PANE) ---

      let filtered = [...state.emails];
      if (state.currentFolder === 'important') filtered = filtered.filter(e => e.isStarred || e.priority === 'p1' || e.priority === 'p2');
      else if (state.currentFolder === 'urgent') filtered = filtered.filter(e => e.priority === 'p1');
      else if (state.currentFolder === 'pending') filtered = filtered.filter(e => e.actionRequired);
      else if (state.currentFolder === 'waiting') filtered = filtered.filter(e => e.actionLabel.includes('Aguardando'));

      if (state.currentCategory !== 'all') filtered = filtered.filter(e => e.category === state.currentCategory);

      if (state.searchQuery.trim()) {
        const q = state.searchQuery.toLowerCase();
        filtered = filtered.filter(e => e.subject.toLowerCase().includes(q) || e.fromName.toLowerCase().includes(q) || e.body.toLowerCase().includes(q));
      }

      const activeEmail = state.emails.find(e => e.id === state.selectedEmailId) || filtered[0] || null;

      return `
        <div class="h-full flex flex-col overflow-hidden">
          <!-- Top Header -->
          <header class="h-14 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 flex items-center justify-between bg-white dark:bg-[#0c1017] shrink-0">

              <div class="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-600 dark:text-emerald-400 font-bold text-sm">ius</div>
              <span class="text-sm font-bold text-slate-900 dark:text-white tracking-tight">EMAIL CONTROL</span>
              <span class="hidden md:inline text-[10px] text-emerald-700 dark:text-emerald-400 font-semibold bg-emerald-500/10 px-2 py-0.5 rounded">Ambiente No-Code Ativo</span>
            </div>

            <!-- Busca Central -->
            <div class="flex-1 max-w-md mx-4">
              <input
                type="text"
                placeholder="Pesquisar e-mails, legislação, fornecedores..."
                value="${state.searchQuery}"
                oninput="state.searchQuery = this.value; render();"
                class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 outline-none focus:border-emerald-500"
              />
            </div>

            <!-- Controles do Topo -->
            <div class="flex items-center gap-3">
              <button onclick="toggleTheme()" class="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs text-slate-700 dark:text-slate-300 transition cursor-pointer">
                ${state.theme === 'dark' ? '☀️ Claro' : '🌙 Escuro'}
              </button>
              <div class="w-7 h-7 rounded-full bg-emerald-500/30 text-emerald-700 dark:text-emerald-300 font-bold text-xs flex items-center justify-center">
                IN
              </div>
            </div>
          </header>

          <!-- 3-Pane Body -->
          <div class="flex-1 flex overflow-hidden">
            <!-- PANE 1: SIDEBAR -->
            <aside class="w-56 border-r border-slate-200 dark:border-slate-800 p-3 flex flex-col justify-between bg-slate-50 dark:bg-[#0c1017] shrink-0 text-xs">
              <div class="space-y-4">
                <!-- Pastas -->
                <div class="space-y-1">
                  <p class="text-[10px] font-bold text-slate-400 uppercase px-2 mb-1.5">Pastas</p>
                  ${[
                    { id: 'inbox', label: 'Caixa de Entrada', count: state.emails.length },
                    { id: 'important', label: 'Importantes', count: state.emails.filter(e => e.isStarred || e.priority === 'p1' || e.priority === 'p2').length },
                    { id: 'urgent', label: 'Urgentes (P1)', count: state.emails.filter(e => e.priority === 'p1').length },
                    { id: 'pending', label: 'Pendentes Ação', count: state.emails.filter(e => e.actionRequired).length },
                    { id: 'waiting', label: 'Aguardando', count: state.emails.filter(e => e.actionLabel.includes('Aguardando')).length }
                  ].map(f => `
                    <button
                      onclick="state.currentFolder = '${f.id}'; render();"
                      class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-left transition cursor-pointer ${state.currentFolder === f.id ? 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200/60 dark:hover:bg-slate-800/60'}"
                    >
                      <span>${f.label}</span>
                      <span class="text-[10px] px-1.5 py-0.5 rounded-full ${state.currentFolder === f.id ? 'bg-emerald-500/20 text-emerald-800 dark:text-emerald-300' : 'bg-slate-200 dark:bg-slate-800 text-slate-500'} font-mono">${f.count}</span>
                    </button>
                  `).join('')}
                </div>

                <!-- Categorias -->
                <div class="space-y-1 pt-2 border-t border-slate-200 dark:border-slate-800">
                  <p class="text-[10px] font-bold text-slate-400 uppercase px-2 mb-1.5">Categorias</p>
                  ${[
                    { id: 'all', label: 'Todas as Categorias' },
                    { id: 'legislacao', label: 'Legislação IUS' },
                    { id: 'clientes', label: 'Clientes' },
                    { id: 'financeiro', label: 'Financeiro' },
                    { id: 'fornecedores', label: 'Fornecedores' }
                  ].map(c => `
                    <button
                      onclick="state.currentCategory = '${c.id}'; render();"
                      class="w-full flex items-center justify-between px-2.5 py-1 rounded-lg text-left transition cursor-pointer text-xs ${state.currentCategory === c.id ? 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200/60 dark:hover:bg-slate-800/60'}"
                    >
                      <span>${c.label}</span>
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- Rodapé da Sidebar -->
              <div class="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-2">
                <div class="px-2 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-[10px] text-emerald-700 dark:text-emerald-400 font-semibold">
                  ● 11 Diretrizes Vigentes
                </div>
                <button onclick="state.currentScreen = 'connect'; render();" class="w-full text-left px-2 py-1 text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 transition text-[11px] cursor-pointer">
                  &larr; Conectar Outra Conta
                </button>
              </div>
            </aside>

            <!-- PANE 2: LISTA DE E-MAILS -->
            <section class="w-80 sm:w-96 border-r border-slate-200 dark:border-slate-800 flex flex-col bg-white dark:bg-[#090d13] shrink-0 overflow-y-auto">
              <div class="p-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/20">
                <span class="text-xs font-bold text-slate-900 dark:text-white uppercase tracking-wider">${filtered.length} Mensagens</span>
                <span class="text-[10px] text-slate-400">Ordenado por relevância</span>
              </div>
              <div class="divide-y divide-slate-100 dark:divide-slate-800/60">
                ${filtered.map(m => {
                  const isSelected = activeEmail && activeEmail.id === m.id;
                  const priorityColor = m.priority === 'p1' ? 'bg-rose-500' : m.priority === 'p2' ? 'bg-amber-500' : 'bg-slate-400';
                  return `
                    <div
                      onclick="selectEmail('${m.id}')"
                      class="p-3 transition cursor-pointer relative ${isSelected ? 'bg-emerald-500/10 dark:bg-emerald-500/15' : 'hover:bg-slate-50 dark:hover:bg-slate-900/40'}"
                    >
                      <div class="absolute left-0 top-0 bottom-0 w-1 ${priorityColor}"></div>
                      <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-1.5 truncate">
                          <button onclick="toggleStar(event, '${m.id}')" class="text-xs ${m.isStarred ? 'text-amber-400' : 'text-slate-300 dark:text-slate-600'}">★</button>
                          <span class="text-xs font-bold ${m.isUnread ? 'text-slate-900 dark:text-white font-extrabold' : 'text-slate-700 dark:text-slate-300'} truncate">${m.fromName}</span>
                        </div>
                        <span class="text-[10px] font-mono text-slate-400 shrink-0">${m.date}</span>
                      </div>
                      <p class="text-xs font-medium text-slate-800 dark:text-slate-200 truncate mt-1 ${m.isUnread ? 'font-bold' : ''}">${m.subject}</p>
                      <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate mt-0.5">${m.body}</p>
                      <div class="mt-2 flex items-center justify-between text-[10px]">
                        <span class="px-1.5 py-0.5 rounded font-semibold uppercase ${m.category === 'legislacao' ? 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-400' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}">${m.category}</span>
                        ${m.actionRequired ? `<span class="text-rose-600 dark:text-rose-400 font-semibold">${m.actionLabel}</span>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>

            <!-- PANE 3: LEITOR & PAINEL DE DIRETRIZES -->
            <main class="flex-1 flex overflow-hidden bg-slate-50 dark:bg-[#0e141f]">
              ${activeEmail ? `
                <div class="flex-1 flex flex-col overflow-hidden border-r border-slate-200 dark:border-slate-800">
                  <!-- Toolbar de Ações -->
                  <div class="h-12 border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between bg-white dark:bg-[#0c1017]">
                    <div class="flex items-center gap-2">
                      <button onclick="archiveEmail('${activeEmail.id}')" class="px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs font-medium transition cursor-pointer">📥 Arquivar</button>
                      <button onclick="toggleRead('${activeEmail.id}')" class="px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs font-medium transition cursor-pointer">${activeEmail.isUnread ? 'Lido' : 'Não Lido'}</button>
                      <button onclick="state.showReplyModal = true; render();" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition cursor-pointer">↩ Responder</button>
                    </div>

                    <!-- Alternância Modo Leitura -->
                    <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg text-xs">
                      <button
                        onclick="state.readingMode = 'formatted'; render();"
                        class="px-2 py-0.5 rounded cursor-pointer ${state.readingMode === 'formatted' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white font-bold shadow-xs' : 'text-slate-500'}"
                      >Formatado</button>
                      <button
                        onclick="state.readingMode = 'clean'; render();"
                        class="px-2 py-0.5 rounded cursor-pointer ${state.readingMode === 'clean' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white font-bold shadow-xs' : 'text-slate-500'}"
                      >Higienizado</button>
                    </div>
                  </div>

                  <!-- Conteúdo do E-mail -->
                  <div class="flex-1 p-6 overflow-y-auto space-y-5">
                    <div class="space-y-1">
                      <div class="flex items-center gap-2">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded">${activeEmail.category}</span>
                        <span class="text-xs text-slate-400 font-mono">${activeEmail.fullDate}</span>
                      </div>
                      <h2 class="text-xl font-bold text-slate-900 dark:text-white leading-snug">${activeEmail.subject}</h2>
                      <div class="flex items-center gap-2 pt-1 text-xs">
                        <span class="font-bold text-slate-800 dark:text-slate-200">${activeEmail.fromName}</span>
                        <span class="text-slate-400">&lt;${activeEmail.fromEmail}&gt;</span>
                      </div>
                    </div>

                    <!-- Corpo Renderizado -->
                    <div class="p-6 rounded-2xl ${state.readingMode === 'clean' ? 'bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 max-w-2xl text-slate-800 dark:text-slate-200 text-sm leading-relaxed whitespace-pre-wrap' : 'bg-white dark:bg-[#121824] border border-slate-200 dark:border-slate-800 text-sm leading-relaxed whitespace-pre-wrap'}">
                      ${activeEmail.body}
                    </div>

                    <!-- Anexos -->
                    ${activeEmail.attachments && activeEmail.attachments.length > 0 ? `
                      <div class="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-2">
                        <p class="text-xs font-bold text-slate-700 dark:text-slate-300">Anexos Identificados (${activeEmail.attachments.length})</p>
                        <div class="flex flex-wrap gap-2">
                          ${activeEmail.attachments.map(att => `
                            <button
                              onclick="downloadMockAttachment('${att.filename}')"
                              class="flex items-center gap-2 px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-emerald-500 text-xs text-slate-800 dark:text-slate-200 transition cursor-pointer"
                            >
                              <span>📄 ${att.filename}</span>
                              <span class="text-[10px] text-slate-400 font-mono">${att.size}</span>
                              <span class="text-emerald-500 font-bold">&darr;</span>
                            </button>
                          `).join('')}
                        </div>
                      </div>
                    ` : ''}
                  </div>
                </div>

                <!-- PAINEL LATERAL DIREITO: DIRETRIZES & CONFORMIDADE IUS -->
                <aside class="w-72 lg:w-80 p-5 border-l border-slate-200 dark:border-slate-800 bg-white dark:bg-[#0c1017] shrink-0 overflow-y-auto space-y-5 text-xs">
                  <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                    <span class="font-bold text-slate-900 dark:text-white uppercase tracking-wider text-[11px]">Inteligência IUS</span>
                    <span class="text-[10px] font-mono text-emerald-600 dark:text-emerald-400 font-bold bg-emerald-500/10 px-2 py-0.5 rounded">Diretriz Vigente</span>
                  </div>

                  <!-- Escopo Legal -->
                  <div class="space-y-3">
                    <div>
                      <p class="text-[10px] font-bold text-slate-400 uppercase">Tema / Escopo</p>
                      <p class="text-sm font-bold text-emerald-600 dark:text-emerald-400 mt-0.5">${activeEmail.complianceScope.themeLabel} (Escopo ${activeEmail.complianceScope.scopeNumber})</p>
                      <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 leading-relaxed">${activeEmail.complianceScope.scopeDescription}</p>
                    </div>

                    <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 space-y-1.5">
                      <p class="text-[10px] font-bold text-slate-400 uppercase">Plano de Ação Recomendado</p>
                      <p class="text-xs font-semibold text-slate-800 dark:text-slate-200 leading-snug">${activeEmail.complianceScope.actionPlan}</p>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-[11px]">
                      <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800">
                        <span class="text-[10px] text-slate-400 block font-bold uppercase">Prazo</span>
                        <span class="font-semibold text-rose-500">${activeEmail.complianceScope.deadline}</span>
                      </div>
                      <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800">
                        <span class="text-[10px] text-slate-400 block font-bold uppercase">Relevância</span>
                        <span class="font-semibold text-emerald-600 dark:text-emerald-400">Alta Conformidade</span>
                      </div>
                    </div>
                  </div>

                  <!-- Checklist dos 11 Escopos -->
                  <div class="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-1.5">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">11 Escopos Monitorados</p>
                    <div class="grid grid-cols-2 gap-1 text-[10px] text-slate-500 dark:text-slate-400">
                      <span class="p-1 rounded bg-slate-100 dark:bg-slate-900/60">1. Meio Ambiente</span>
                      <span class="p-1 rounded bg-slate-100 dark:bg-slate-900/60">2. Resíduos</span>
                      <span class="p-1 rounded bg-slate-100 dark:bg-slate-900/60">3. SSO / NR-01</span>
                      <span class="p-1 rounded bg-slate-100 dark:bg-slate-900/60">4. NR-33/35</span>
                      <span class="p-1 rounded bg-slate-100 dark:bg-slate-900/60">5. ISO 14001</span>
                      <span class="p-1 rounded bg-slate-100 dark:bg-slate-900/60">6. ISO 45001</span>
                    </div>
                  </div>
                </aside>
              ` : `
                <div class="flex-1 flex items-center justify-center text-slate-400 text-xs">
                  Nenhum e-mail selecionado.
                </div>
              `}
            </main>
          </div>

          <!-- Modal de Resposta Operacional -->
          ${state.showReplyModal ? `
            <div class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div class="bg-white dark:bg-[#111724] border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl space-y-4">
                <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <h3 class="text-sm font-bold text-slate-900 dark:text-white">Responder: ${activeEmail.fromName}</h3>
                  <button onclick="state.showReplyModal = false; render();" class="text-slate-400 hover:text-white">&times;</button>
                </div>
                <textarea
                  rows="4"
                  placeholder="Escreva sua resposta operacional..."
                  value="${state.replyContent}"
                  oninput="state.replyContent = this.value;"
                  class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-xs text-slate-900 dark:text-white placeholder-slate-400 outline-none focus:border-emerald-500"
                ></textarea>
                <div class="flex justify-end gap-2 pt-2">
                  <button onclick="state.showReplyModal = false; render();" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold cursor-pointer">Cancelar</button>
                  <button onclick="sendReply()" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold cursor-pointer">Enviar Resposta</button>
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // Inicialização
    render();
  </script>
</body>
</html>
